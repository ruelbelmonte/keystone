name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a new NuGet advisory or SDK change fails here before it fails a user.
  schedule:
    - cron: "0 18 * * 0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: content
        run: dotnet restore
      - name: Format check
        working-directory: content
        run: dotnet format --verify-no-changes
      - name: Build
        working-directory: content
        run: dotnet build -c Release --no-restore
      - name: Test
        working-directory: content
        run: dotnet test -c Release --no-build
      - name: Pack template
        run: dotnet pack Keystone.TemplatePack.csproj -c Release -o ./artifacts
      - name: Generate a project from the template and test it
        run: |
          dotnet new install ./artifacts/Keystone.WebApi.Templates.*.nupkg
          dotnet new keystone -n Acme.Billing -o "$RUNNER_TEMP/Acme.Billing"
          cd "$RUNNER_TEMP/Acme.Billing"
          dotnet test
