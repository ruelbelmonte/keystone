name: ci

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a new NuGet advisory or SDK change fails here before it fails a user.
  schedule:
    - cron: "0 18 * * 0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: content
        run: dotnet restore
      - name: Format check
        working-directory: content
        run: dotnet format --verify-no-changes
      - name: Build
        working-directory: content
        run: dotnet build -c Release --no-restore
      - name: Test
        working-directory: content
        run: dotnet test -c Release --no-build
      - name: Pack template
        run: dotnet pack Keystone.TemplatePack.csproj -c Release -o ./artifacts
      - name: Generate a project from the template and test it
        run: |
          dotnet new install ./artifacts/Keystone.WebApi.Templates.*.nupkg
          dotnet new keystone -n Acme.Billing -o "$RUNNER_TEMP/Acme.Billing"
          cd "$RUNNER_TEMP/Acme.Billing"
          dotnet test
